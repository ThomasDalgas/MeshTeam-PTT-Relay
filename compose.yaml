services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      RELAY_CONFIG: /app/data/relay.json
    volumes:
      - relay_data:/app/data
    expose:
      - '8788'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay]
volumes:
  relay_data:
  caddy_data:
  caddy_config:
