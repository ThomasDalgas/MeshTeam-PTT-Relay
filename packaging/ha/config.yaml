name: MeshTeam PTT Relay
version: "0.1.6"
slug: meshteam_relay
description: Private encrypted voice relay with QR enrollment and temporary deferred delivery
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
init: true
timeout: 15
ingress: true
ingress_port: 8099
panel_icon: mdi:radio-handheld
panel_title: MeshTeam PTT Relay
panel_admin: true
watchdog: "tcp://[HOST]:8099"
map:
  - ssl:ro
ports:
  8443/tcp: null
  8788/tcp: null
ports_description:
  8443/tcp: HTTPS/WSS relay only — map a host port after configuring TLS
  8788/tcp: Relay HTTP/WebSocket upstream — use only behind a trusted HTTPS reverse proxy
options:
  tls_enabled: false
  public_origin: ""
  group_name: MeshTeam
  owner_name: Owner
schema:
  tls_enabled: bool
  public_origin: "str(0,512)"
  group_name: "str(1,64)"
  owner_name: "str(1,64)"
url: https://github.com/funkoneinc/MeshTeam-PTT-Relay
