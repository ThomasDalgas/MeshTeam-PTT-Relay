name: Test relay and packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/package-ha.mjs --check
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/relay.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: RELAY_DOMAIN=relay.example.com docker compose config --quiet
      - name: Build relay for Linux AMD64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build Home Assistant app for AMD64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./meshteam_relay
          platforms: linux/amd64,linux/arm64
          push: false
